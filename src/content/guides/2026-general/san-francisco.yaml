  - name: San Francisco Ballot Measures
    intro: Every local measure this year needs a simple majority to pass.
    contests:
      - measure: Proposition A
        title: Charter changes to City departments and commissions
        kind: measure
        summary: Eliminates or reorganizes certain commissions, moves many commissions from the Charter into the Municipal Code, expands the City Administrator's real estate role, and changes how legal settlements are approved.
        threshold: "50%+1"
        placed_by: Board of Supervisors, 9 to 2
        supporters: Mayor Daniel Lurie, as part of the "Clean Up City Hall" package with D, E, and F; GrowSF
        opponents: Coalition on Homelessness
        position: yes
        why: >
          Some history. In 2024 there were two competing commission reform measures: Prop D, which would
          have capped the city at 65 commissions outright, and Peskin's Prop E, which created a task force
          to study the problem instead. I voted for D and called E feckless. D lost, E won, and credit
          where it's due, the task force did its job. It produced the first complete inventory of every
          commission in the city, which nobody had ever bothered to make, and recommended a long list of
          cuts and mergers. Prop A is the Board of Supervisors acting on those recommendations. It takes
          the charter from 55 commissions to 38, moving nine into the Municipal Code where they can be
          changed by ordinance instead of a ballot measure, and eliminating or merging eight more. The
          Board adopted a narrower version than the task force wanted, so this is less than D would have
          done, but it's real progress and it came out of a process that I didn't think would deliver.
          Vote Yes.
      - measure: Proposition B
        title: Municipal finance corporation and public bank
        kind: measure
        summary: Authorizes the City to create a city-owned non-deposit lender that could later convert into a public bank after profitable operation and regulatory approval.
        threshold: "50%+1"
        placed_by: Board of Supervisors, 9 to 2
        supporters: SF Public Bank Coalition, San Francisco Foundation, SF Labor Council
        opponents: GrowSF and individual opponents
        position: no
      - measure: Proposition C
        title: Housing Trust Fund contributions
        kind: measure
        summary: Gradually raises the City's annual Housing Trust Fund contribution to $125 million, expands eligible uses to include social housing and co-ops, raises the down payment loan income limit to 200% of area median income, and extends the fund from 2043 to 2058.
        threshold: "50%+1"
        placed_by: Board of Supervisors, 11 to 0
        supporters: Non-Profit Housing Association of Northern California, San Franciscans for Social Housing, SF Democratic Party, GrowSF
        opponents: SF Republican Party
        position: yes
      - measure: Proposition D
        title: Changes to the ballot measure process
        kind: measure
        summary: Raises the signature requirement for citizen initiatives from 2% to 8% of registered voters, raises the threshold for calling special elections to 10%, allows initiatives to be withdrawn before an election, and removes the ability of the Mayor or four Supervisors to place measures on the ballot.
        threshold: "50%+1"
        placed_by: Signature petition, sponsored by Mayor Lurie
        supporters: Mayor Daniel Lurie, SF Democratic Party, Teamsters Local 665, Gov. Gavin Newsom, GrowSF
        opponents: SF Labor Council, Senior and Disability Action, United Educators of SF, SF Tenants Union, Indivisible SF
        position: yes
      - measure: Proposition E
        title: City Administrator authority and contracting
        kind: measure
        summary: Centralizes purchasing and contracting authority under the City Administrator, raises the contract values requiring Board approval from $10 million to $25 million, and extends the City Administrator's term from 5 to 10 years.
        threshold: "50%+1"
        placed_by: Signature petition, sponsored by Mayor Lurie
        supporters: Mayor Daniel Lurie, SF Democratic Party, Firefighters Local 798, SF Building Trades, GrowSF
        opponents: SF Labor Council and allied groups
        position: yes
      - measure: Proposition F
        title: Executive branch management
        kind: measure
        summary: Expands the Mayor's authority to transfer responsibilities between departments, hire deputy mayors, hire and fire most department heads including the Police Chief, and lets appointing authorities remove most commissioners without cause.
        threshold: "50%+1"
        placed_by: Signature petition, sponsored by Mayor Lurie
        supporters: Mayor Daniel Lurie, SF Democratic Party, SPUR, SF Chamber of Commerce, Firefighters Local 798, SEIU 87, GrowSF
        opponents: Small Business Forward, DSA SF, SF Labor Council
        position: yes
      - measure: Proposition G
        title: Private vehicles on the Upper Great Highway
        kind: measure
        summary: Closes Sunset Dunes Park to recreation on weekdays and reopens the Upper Great Highway to private vehicles Monday 4 a.m. through Friday 6 p.m., reversing part of 2024's Prop K.
        threshold: "50%+1"
        placed_by: Signature petition
        supporters: Chinese American Democratic Club, SF Taxpayers Association, Richmond District Democratic Club, Supervisor Alan Wong
        opponents: Sierra Club, SPUR, Surfrider SF, Outer Sunset Neighbors, Scott Wiener, GrowSF
        position: no
        why: Puts cars back on the Great Highway. Cars are still bad.
      - measure: Proposition H
        title: Parcel tax for Muni operations
        kind: measure
        summary: Creates a 15-year parcel tax based on property type and square footage, from $129 per single-family parcel up to $400,000, with senior exemptions, raising about $177 million a year for Muni service.
        threshold: "50%+1"
        placed_by: Signature petition
        supporters: SF Democratic Party, SF Labor Council, SF Chamber of Commerce, SF Tenants Union, Seamless Bay Area, GrowSF
        opponents: SF Republican Party, Business League
        position: yes
        why: Raises property taxes to fund public transit. My two favorite things.
      - measure: Proposition I
        title: Transfer tax dedication for affordable housing
        kind: measure
        summary: Permanently dedicates half of transfer tax revenue from property sales over $10 million to a new House SF Fund for affordable and social housing. Prevails over Prop J if both pass and conflict.
        threshold: "50%+1"
        placed_by: Signature petition, backed by DSA SF and Dean Preston
        supporters: Affordable Housing Alliance, SF Tenants Union, SEIU 1021, Small Business Forward, DSA SF
        opponents: SF Taxpayers Association, SF Building and Construction Trades Council, GrowSF
        position: no
        why: >
          Every year the progressive bloc of the BoS comes up with new and inventive ways to siphon money from the city budget into their own pet projects and NGOs. It's really quite impressive.
          Despite the confusing wording, this measure does not raise taxes or create any new revenue streams for the city.
          It simply diverts existing revenue from the general fund to a random list of preferred housing programs. It also strips future city governments of the capacity to reallocate this money in the future.
          In general, strict revenue earmarking is a bad idea as the needs of the city vary over time, and you want to give future city governments the flexibility to allocate resources as they see fit. Vote No.
      - measure: Proposition J
        title: End the foreclosure exemption for the transfer tax
        kind: measure
        summary: Starting in 2027, ends the transfer tax exemption for commercial, industrial, and large residential properties transferred to a lender in or to avoid foreclosure, for an estimated $100 million to $150 million a year.
        threshold: "50%+1"
        placed_by: Board of Supervisors, 10 to 0
        supporters: Mayor Daniel Lurie, SF Democratic Party, SEIU 1021, SEIU 2015, GrowSF
        opponents: SF Taxpayers Association
        position: yes
        why: >
          This measure closes a loophole in the transfer tax that allows banks to avoid paying the tax when they take ownership of a property in foreclosure. This is a common-sense reform that ensures that banks pay their fair share and that the city receives the revenue it needs to fund essential services. Vote Yes.
