  - name: Judicial Retention
    intro: >
      Retention votes are yes-or-no on each justice. The two Supreme Court justices appear on every
      ballot in the state. San Francisco, Oakland, and San Mateo voters also see eleven First District
      Court of Appeal justices; Palo Alto voters see two Sixth District justices instead.
    contests:
